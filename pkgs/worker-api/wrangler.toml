name = "famcsschedulebot"
main = "src/index.ts"
compatibility_date = "2026-08-30"


[[d1_databases]]
binding = "DB"
database_name = "schedule_db"
database_id = "f3602b67-4b28-49f5-90a9-88745a580fd1"

# Create this namespace in Cloudflare, then  replace the placeholder with its ID.
# D1 stays bound for future Telegram users/subscriptions, but schedule routes use KV only.
[[kv_namespaces]]
binding = "SCHEDULE_KV"
id = "7d5aa985c9414f42ae35be831ecce220"


[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
